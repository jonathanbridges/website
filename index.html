<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/theme-init.js"></script>
    <style>
      html,
      body {
        background-color: #f5f5f0;
        color: #0a0a0a;
      }

      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background-color: #0a0a0a;
        color: #f5f5f0;
        color-scheme: dark;
      }

      html[data-theme="geocities"],
      html[data-theme="geocities"] body {
        background-color: #000080;
        color: #00ff00;
      }

      html[data-theme="light"] {
        color-scheme: light;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jonathan Bridges — Software Developer based in San Francisco. React, TypeScript, and full-stack experience."
    />
    <meta property="og:title" content="Jonathan Bridges | Software Developer" />
    <meta
      property="og:description"
      content="Software developer with a passion for lifelong learning, problem-solving, and building great products."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jonathanbridges.com" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <title>Jonathan Bridges | Software Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
